<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TP Platform</title>
<style>
  body{font-family:system-ui,sans-serif;background:#08090F;color:#ECF0F9;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
  .box{text-align:center;max-width:420px;width:100%}
  .mark{width:56px;height:56px;background:#C9A84C;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#07080D;margin:0 auto 24px;font-family:'Segoe UI',system-ui,sans-serif}
  h1{font-size:20px;font-weight:700;margin-bottom:10px;font-family:'Segoe UI',system-ui,sans-serif}
  p{font-size:13px;color:#8994AB;margin-bottom:24px;line-height:1.7}
  .btn{display:inline-flex;align-items:center;gap:8px;background:#C9A84C;color:#07080D;font-weight:700;font-size:14px;padding:12px 28px;border-radius:10px;text-decoration:none;border:none;cursor:pointer;font-family:system-ui,sans-serif;transition:opacity .15s}
  .btn:hover{opacity:.88}
  .note{margin-top:16px;font-size:11px;color:#5A6480;line-height:1.6}
</style>
</head>
<body>
<div class="box">
  <div class="mark">TP</div>
  <h1>TP Platform</h1>
  <p>The platform requires a dedicated browser tab for Microsoft 365 sign-in and secure data sync. Click the button below to open it.</p>
  <a href="https://bahiansary.github.io/tp-platform/tp-platform.html" target="_blank" rel="noopener" class="btn" id="open-btn">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
    Open TP Platform
  </a>
  <div class="note">Opens in a new tab · Microsoft 365 authentication required</div>
</div>
<script>
  // If this page is the top-level window (not inside a SharePoint iframe), redirect automatically.
  // If inside an iframe (SharePoint web part), the button above is shown so the user opens a proper tab.
  (function() {
    var TARGET = 'https://bahiansary.github.io/tp-platform/tp-platform.html';
    try {
      if (window.self === window.top) {
        // Top-level — safe to redirect immediately
        window.location.replace(TARGET);
      }
      // else: inside iframe — show the "Open" button (don't navigate away from SharePoint)
    } catch(e) {
      // Cross-origin frame check blocked — assume iframe, show button
    }
  })();
</script>
</body>
</html>
